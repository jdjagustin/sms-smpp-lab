<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#38bdf8"/></marker>
    <marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fb923c"/></marker>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1100" height="700" fill="#0f172a"/>
  <text x="30" y="38" fill="#e2e8f0" font-size="21" font-weight="bold">SMS end to end - where SMPP and MAP sit</text>
  <text x="30" y="58" fill="#94a3b8" font-size="12">Simplified. Message names (MO/MT-ForwardSM, SRI-for-SM) to be verified against 3GPP TS 23.040 / TS 29.002 in phase 4.</text>

  <!-- HLR -->
  <rect x="440" y="90" width="230" height="60" rx="10" fill="#3b2a12" stroke="#fb923c" stroke-width="2"/>
  <text x="555" y="116" fill="#ffedd5" font-size="15" text-anchor="middle" font-weight="bold">HLR</text>
  <text x="555" y="136" fill="#fed7aa" font-size="11" text-anchor="middle">subscriber DB: where is the phone?</text>

  <!-- Main row -->
  <rect x="30" y="230" width="120" height="70" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <text x="90" y="260" fill="#e2e8f0" font-size="15" text-anchor="middle" font-weight="bold">Phone A</text>
  <text x="90" y="280" fill="#94a3b8" font-size="11" text-anchor="middle">sender (MO)</text>

  <rect x="210" y="230" width="140" height="70" rx="10" fill="#3b2a12" stroke="#fb923c" stroke-width="2"/>
  <text x="280" y="260" fill="#ffedd5" font-size="15" text-anchor="middle" font-weight="bold">MSC / VLR</text>
  <text x="280" y="280" fill="#fed7aa" font-size="11" text-anchor="middle">serving phone A</text>

  <rect x="470" y="220" width="170" height="90" rx="12" fill="#0c4a6e" stroke="#38bdf8" stroke-width="3"/>
  <text x="555" y="255" fill="#e0f2fe" font-size="18" text-anchor="middle" font-weight="bold">SMSC</text>
  <text x="555" y="276" fill="#bae6fd" font-size="12" text-anchor="middle">store and forward</text>
  <text x="555" y="293" fill="#bae6fd" font-size="11" text-anchor="middle">(general idea, details to verify)</text>

  <rect x="760" y="230" width="140" height="70" rx="10" fill="#3b2a12" stroke="#fb923c" stroke-width="2"/>
  <text x="830" y="260" fill="#ffedd5" font-size="15" text-anchor="middle" font-weight="bold">MSC / VLR</text>
  <text x="830" y="280" fill="#fed7aa" font-size="11" text-anchor="middle">serving phone B</text>

  <rect x="950" y="230" width="120" height="70" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <text x="1010" y="260" fill="#e2e8f0" font-size="15" text-anchor="middle" font-weight="bold">Phone B</text>
  <text x="1010" y="280" fill="#94a3b8" font-size="11" text-anchor="middle">receiver (MT)</text>

  <!-- arrows main row -->
  <line x1="152" y1="265" x2="208" y2="265" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#mg)"/>
  <text x="180" y="252" fill="#94a3b8" font-size="10" text-anchor="middle">radio</text>
  <line x1="352" y1="265" x2="468" y2="265" stroke="#fb923c" stroke-width="3" marker-end="url(#mo)"/>
  <text x="410" y="246" fill="#fdba74" font-size="11" text-anchor="middle" font-weight="bold">MAP</text>
  <text x="410" y="258" fill="#fdba74" font-size="10" text-anchor="middle">MO-ForwardSM</text>
  <line x1="642" y1="265" x2="758" y2="265" stroke="#fb923c" stroke-width="3" marker-end="url(#mo)"/>
  <text x="700" y="246" fill="#fdba74" font-size="11" text-anchor="middle" font-weight="bold">MAP</text>
  <text x="700" y="258" fill="#fdba74" font-size="10" text-anchor="middle">MT-ForwardSM</text>
  <line x1="902" y1="265" x2="948" y2="265" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#mg)"/>
  <text x="925" y="252" fill="#94a3b8" font-size="10" text-anchor="middle">radio</text>

  <!-- SRI -->
  <line x1="555" y1="218" x2="555" y2="152" stroke="#fb923c" stroke-width="3" marker-start="url(#mo)" marker-end="url(#mo)"/>
  <text x="565" y="190" fill="#fdba74" font-size="11" font-weight="bold">MAP SRI-for-SM</text>
  <text x="565" y="203" fill="#fdba74" font-size="10">(ask HLR, then forward)</text>

  <!-- SMPP -->
  <rect x="440" y="420" width="230" height="64" rx="10" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
  <text x="555" y="447" fill="#e0f2fe" font-size="14" text-anchor="middle" font-weight="bold">ESME</text>
  <text x="555" y="466" fill="#bae6fd" font-size="11" text-anchor="middle">apps, aggregators, A2P senders</text>
  <line x1="555" y1="418" x2="555" y2="312" stroke="#38bdf8" stroke-width="3" marker-start="url(#mb)" marker-end="url(#mb)"/>
  <text x="543" y="360" fill="#7dd3fc" font-size="12" font-weight="bold" text-anchor="end">SMPP over TCP/IP</text>
  <text x="543" y="376" fill="#7dd3fc" font-size="10" text-anchor="end">bind, submit_sm, deliver_sm (DLR)...</text>

  <!-- firewall tags -->
  <rect x="302" y="316" width="156" height="34" rx="8" fill="#450a0a" stroke="#f87171" stroke-dasharray="5 3"/>
  <text x="380" y="331" fill="#fecaca" font-size="10" text-anchor="middle" font-weight="bold">SMS firewall (typical spot)</text>
  <text x="380" y="344" fill="#fca5a5" font-size="9" text-anchor="middle">filters MAP traffic into the SMSC</text>
  <line x1="400" y1="316" x2="410" y2="270" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="580" y="340" width="170" height="34" rx="8" fill="#450a0a" stroke="#f87171" stroke-dasharray="5 3"/>
  <text x="665" y="355" fill="#fecaca" font-size="10" text-anchor="middle" font-weight="bold">SMS firewall (typical spot)</text>
  <text x="665" y="368" fill="#fca5a5" font-size="9" text-anchor="middle">filters SMPP traffic from ESMEs</text>
  <line x1="580" y1="357" x2="560" y2="357" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Lab strip -->
  <rect x="30" y="530" width="1040" height="120" rx="12" fill="#111c33" stroke="#334155" stroke-width="2"/>
  <text x="46" y="554" fill="#cbd5e1" font-size="13" font-weight="bold">Our lab maps onto the SMPP side only</text>
  <rect x="50" y="570" width="200" height="58" rx="8" fill="none" stroke="#64748b" stroke-dasharray="6 4"/>
  <text x="150" y="596" fill="#94a3b8" font-size="12" text-anchor="middle">Python SMPP client</text>
  <text x="150" y="612" fill="#94a3b8" font-size="10" text-anchor="middle">phase 2 (not built)</text>
  <rect x="330" y="570" width="220" height="58" rx="8" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
  <text x="440" y="596" fill="#dcfce7" font-size="13" text-anchor="middle" font-weight="bold">Jasmin gateway (running)</text>
  <text x="440" y="612" fill="#bbf7d0" font-size="10" text-anchor="middle">SMPP server :2775 + connector</text>
  <rect x="640" y="570" width="220" height="58" rx="8" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
  <text x="750" y="594" fill="#dcfce7" font-size="13" text-anchor="middle" font-weight="bold">SMPPSim (SMSC simulator)</text>
  <text x="750" y="610" fill="#bbf7d0" font-size="10" text-anchor="middle">running; Jasmin connector BOUND_TRX</text>
  <line x1="252" y1="599" x2="328" y2="599" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#mb)"/>
  <line x1="552" y1="599" x2="638" y2="599" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#mb)"/>
  <text x="880" y="590" fill="#94a3b8" font-size="10">MAP / SS7 side is study-only</text>
  <text x="880" y="606" fill="#94a3b8" font-size="10">(phase 4, no live signalling here)</text>

  <!-- Legend -->
  <rect x="30" y="660" width="14" height="4" fill="#38bdf8"/><text x="50" y="666" fill="#94a3b8" font-size="11">SMPP (industry protocol for apps, runs over TCP/IP)</text>
  <rect x="400" y="660" width="14" height="4" fill="#fb923c"/><text x="420" y="666" fill="#94a3b8" font-size="11">MAP (3GPP, carried over SS7 signalling)</text>
  <rect x="720" y="660" width="14" height="4" fill="#94a3b8"/><text x="740" y="666" fill="#94a3b8" font-size="11">Radio access (out of scope)</text>
  <text x="30" y="688" fill="#64748b" font-size="10">Firewall placements are typical, not the only ones.</text>
</svg>
