<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>SMS/SMPP lab: what is running at the end of phase 1</title>
  <desc>On a Mac, Docker Compose runs four containers: jasmin, redis, rabbit-mq and smppsim. Jasmin uses Redis and RabbitMQ, connects to SMPPSim over SMPP, and stores its jCli profile in a named volume. A terminal reaches the jCli console and a browser reaches the SMPPSim web panel, both on 127.0.0.1.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9fb3c8"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4ade80"/></marker>
  </defs>
  <rect width="960" height="600" fill="#0f172a"/>
  <text x="30" y="38" fill="#e2e8f0" font-size="20" font-weight="bold">SMS/SMPP lab - what is running (end of phase 1)</text>
  <text x="30" y="58" fill="#94a3b8" font-size="12">Verified 2026-10-18: after docker compose down + up -d, the Jasmin connector to SMPPSim came back in BOUND_TRX</text>

  <!-- Mac -->
  <rect x="20" y="75" width="920" height="455" rx="14" fill="#111c33" stroke="#334155" stroke-width="2"/>
  <text x="36" y="98" fill="#cbd5e1" font-size="14" font-weight="bold">Your Mac (Apple Silicon, arm64)</text>

  <!-- Terminal -->
  <rect x="40" y="130" width="190" height="80" rx="10" fill="#1e293b" stroke="#64748b"/>
  <text x="135" y="156" fill="#e2e8f0" font-size="14" text-anchor="middle" font-weight="bold">Terminal</text>
  <text x="135" y="178" fill="#94a3b8" font-size="12" text-anchor="middle">nc 127.0.0.1 8990</text>
  <text x="135" y="196" fill="#94a3b8" font-size="11" text-anchor="middle">jCli management console</text>

  <!-- Browser -->
  <rect x="40" y="230" width="190" height="80" rx="10" fill="#1e293b" stroke="#64748b"/>
  <text x="135" y="256" fill="#e2e8f0" font-size="14" text-anchor="middle" font-weight="bold">Browser</text>
  <text x="135" y="278" fill="#94a3b8" font-size="12" text-anchor="middle">http://127.0.0.1:8089</text>
  <text x="135" y="296" fill="#94a3b8" font-size="11" text-anchor="middle">SMPPSim control panel</text>

  <!-- Docker Desktop -->
  <rect x="290" y="110" width="630" height="395" rx="12" fill="#0b2540" stroke="#38bdf8" stroke-width="2"/>
  <text x="306" y="132" fill="#7dd3fc" font-size="13" font-weight="bold">Docker Desktop VM - compose project "sms-smpp-lab"</text>

  <!-- Jasmin -->
  <rect x="320" y="165" width="250" height="170" rx="10" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
  <text x="445" y="190" fill="#dcfce7" font-size="16" text-anchor="middle" font-weight="bold">jasmin</text>
  <text x="445" y="210" fill="#bbf7d0" font-size="12" text-anchor="middle">jookies/jasmin:latest (0.11.0)</text>
  <text x="445" y="228" fill="#bbf7d0" font-size="12" text-anchor="middle">SMS gateway</text>
  <text x="445" y="246" fill="#fde68a" font-size="11" text-anchor="middle">amd64 image, runs under emulation</text>
  <text x="445" y="270" fill="#dcfce7" font-size="11" text-anchor="middle" font-weight="bold">Published on 127.0.0.1 only:</text>
  <text x="445" y="286" fill="#dcfce7" font-size="11" text-anchor="middle">2775 SMPP · 8990 jCli · 1401 HTTP API</text>
  <text x="445" y="310" fill="#bbf7d0" font-size="11" text-anchor="middle">jCli config: group lab, user lab_user,</text>
  <text x="445" y="324" fill="#bbf7d0" font-size="11" text-anchor="middle">connector smppsim, DefaultRoute</text>

  <!-- Redis -->
  <rect x="660" y="165" width="230" height="60" rx="10" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/>
  <text x="775" y="192" fill="#dbeafe" font-size="15" text-anchor="middle" font-weight="bold">redis</text>
  <text x="775" y="210" fill="#bfdbfe" font-size="12" text-anchor="middle">healthy - 6379 internal only</text>

  <!-- RabbitMQ -->
  <rect x="660" y="255" width="230" height="60" rx="10" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/>
  <text x="775" y="282" fill="#dbeafe" font-size="15" text-anchor="middle" font-weight="bold">rabbit-mq</text>
  <text x="775" y="300" fill="#bfdbfe" font-size="12" text-anchor="middle">healthy - AMQP 5672 internal only</text>

  <!-- internal arrows jasmin -> redis / rabbit -->
  <line x1="570" y1="200" x2="658" y2="195" stroke="#9fb3c8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="570" y1="280" x2="658" y2="285" stroke="#9fb3c8" stroke-width="2" marker-end="url(#a)"/>
  <text x="614" y="188" fill="#94a3b8" font-size="10" text-anchor="middle">uses</text>
  <text x="614" y="304" fill="#94a3b8" font-size="10" text-anchor="middle">uses</text>

  <!-- smppsim -->
  <rect x="320" y="375" width="250" height="100" rx="10" fill="#78350f" stroke="#fbbf24" stroke-width="2"/>
  <text x="445" y="400" fill="#fef3c7" font-size="16" text-anchor="middle" font-weight="bold">smppsim</text>
  <text x="445" y="420" fill="#fde68a" font-size="12" text-anchor="middle">jookies/smppsim:latest (2.6.3)</text>
  <text x="445" y="438" fill="#fde68a" font-size="12" text-anchor="middle">SMSC simulator</text>
  <text x="445" y="456" fill="#fde68a" font-size="11" text-anchor="middle">amd64 image, runs under emulation</text>
  <text x="445" y="469" fill="#fde68a" font-size="10" text-anchor="middle">web panel published on 127.0.0.1:8089</text>
  <line x1="445" y1="337" x2="445" y2="373" stroke="#4ade80" stroke-width="2.5" marker-end="url(#g)"/>
  <text x="457" y="360" fill="#86efac" font-size="11">SMPP (BOUND_TRX)</text>

  <!-- Volume -->
  <rect x="660" y="375" width="230" height="70" rx="10" fill="#3b0764" stroke="#c084fc" stroke-width="2"/>
  <text x="775" y="400" fill="#f3e8ff" font-size="14" text-anchor="middle" font-weight="bold">volume jasmin-store</text>
  <text x="775" y="418" fill="#e9d5ff" font-size="11" text-anchor="middle">named volume at /etc/jasmin/store</text>
  <text x="775" y="432" fill="#e9d5ff" font-size="11" text-anchor="middle">holds the jCli profile (persist)</text>
  <line x1="570" y1="325" x2="658" y2="385" stroke="#c084fc" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>

  <!-- published arrows from the Mac -->
  <line x1="232" y1="170" x2="318" y2="200" stroke="#4ade80" stroke-width="3" marker-end="url(#g)"/>
  <line x1="232" y1="270" x2="318" y2="420" stroke="#4ade80" stroke-width="3" marker-end="url(#g)"/>

  <!-- Not built yet -->
  <text x="36" y="372" fill="#94a3b8" font-size="12" font-weight="bold">Not built yet (dashed)</text>
  <rect x="40" y="384" width="180" height="40" rx="8" fill="none" stroke="#64748b" stroke-dasharray="6 4"/>
  <text x="130" y="409" fill="#94a3b8" font-size="12" text-anchor="middle">Python SMPP client - phase 2</text>
  <rect x="40" y="434" width="180" height="40" rx="8" fill="none" stroke="#64748b" stroke-dasharray="6 4"/>
  <text x="130" y="459" fill="#94a3b8" font-size="12" text-anchor="middle">Wireshark - phase 3</text>

  <text x="30" y="555" fill="#94a3b8" font-size="12">Redis and RabbitMQ publish no ports to the Mac: only containers on the compose network reach them.</text>
  <text x="30" y="575" fill="#94a3b8" font-size="12">SMPPSim's own SMPP port (2775) is not published either: Jasmin reaches it inside the network as smppsim:2775.</text>
</svg>
