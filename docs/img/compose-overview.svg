<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" font-family="Arial, Helvetica, sans-serif">
  <title>How Docker Compose starts Jasmin, Redis, RabbitMQ and SMPPSim</title>
  <desc>A docker-compose.yml file describes four containers. The command docker compose up -d reads it and starts them. Jasmin waits for Redis and RabbitMQ to be healthy. SMPPSim, the SMSC simulator, has no Compose dependency: Jasmin connects to it over SMPP.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#9fb3c8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#0f172a"/>
  <rect x="60" y="20" width="220" height="56" rx="8" fill="#1e293b" stroke="#9fb3c8" stroke-width="0.5"/>
  <text x="170" y="39" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#e2e8f0">docker-compose.yml</text>
  <text x="170" y="59" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#94a3b8">The recipe (plain text)</text>
  <rect x="400" y="20" width="220" height="56" rx="8" fill="#1e293b" stroke="#9fb3c8" stroke-width="0.5"/>
  <text x="510" y="39" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#e2e8f0">docker compose up -d</text>
  <text x="510" y="59" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#94a3b8">One single command</text>
  <line x1="398" y1="48" x2="282" y2="48" stroke="#9fb3c8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="170" y1="78" x2="170" y2="108" stroke="#9fb3c8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="110" width="600" height="270" rx="16" fill="none" stroke="#64748b" stroke-width="0.5" stroke-dasharray="5 4"/>
  <text x="60" y="134" dominant-baseline="central" font-size="12" fill="#e2e8f0">Docker Compose starts the 4 containers together</text>
  <rect x="70" y="156" width="160" height="56" rx="8" fill="#3b2a5c" stroke="#c084fc" stroke-width="0.5"/>
  <text x="150" y="175" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#e9d5ff">Redis</text>
  <text x="150" y="195" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#c084fc">DLR tracking, billing</text>
  <rect x="260" y="156" width="160" height="56" rx="8" fill="#14532d" stroke="#4ade80" stroke-width="0.5"/>
  <text x="340" y="175" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#bbf7d0">Jasmin</text>
  <text x="340" y="195" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4ade80">SMS gateway</text>
  <rect x="450" y="156" width="160" height="56" rx="8" fill="#3b2a5c" stroke="#c084fc" stroke-width="0.5"/>
  <text x="530" y="175" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#e9d5ff">RabbitMQ</text>
  <text x="530" y="195" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#c084fc">AMQP message broker</text>
  <line x1="258" y1="184" x2="232" y2="184" stroke="#9fb3c8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="422" y1="184" x2="448" y2="184" stroke="#9fb3c8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="260" y="262" width="160" height="56" rx="8" fill="#422006" stroke="#fbbf24" stroke-width="0.5"/>
  <text x="340" y="281" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#fde68a">SMPPSim</text>
  <text x="340" y="301" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#fef3c7">SMSC simulator</text>
  <line x1="340" y1="214" x2="340" y2="260" stroke="#9fb3c8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="352" y="238" dominant-baseline="central" font-size="11" fill="#e2e8f0">SMPP (no Compose dependency)</text>
  <text x="340" y="344" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#e2e8f0">Solid arrows: Jasmin waits for Redis and RabbitMQ to be healthy</text>
  <text x="340" y="364" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#e2e8f0">Published on 127.0.0.1: Jasmin 2775 SMPP · 8990 jCli · 1401 HTTP · SMPPSim web 8089</text>
</svg>
