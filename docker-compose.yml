# Lab compose file for Jasmin SMS gateway + its supporting services.
# Adapted from the official docker-compose.yml in https://github.com/jookies/jasmin
# Changes vs. the official file (which is meant for developing Jasmin itself):
#   - jasmin uses the published image instead of building from source
#   - platform pinned to linux/amd64 (the published image has no arm64 build)
#   - ports published on 127.0.0.1 only (jCli ships with default credentials)
#   - top-level `version` removed (obsolete in current Compose)
#   - smppsim added: an SMSC simulator (image referenced by Jasmin's own docs) so Jasmin has an upstream SMSC to forward to
#   - named volume jasmin-store keeps the jCli `persist` profile across `docker compose down` + `up`

services:
  redis:
    image: redis:alpine
    restart: unless-stopped
    healthcheck:
      test: redis-cli ping | grep PONG
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    security_opt:
      - no-new-privileges:true

  rabbit-mq:
    image: rabbitmq:3.10-management-alpine
    restart: unless-stopped
    healthcheck:
      test: rabbitmq-diagnostics -q ping
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 525M
    security_opt:
      - no-new-privileges:true

  jasmin:
    image: jookies/jasmin:latest
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "127.0.0.1:2775:2775"
      - "127.0.0.1:8990:8990"
      - "127.0.0.1:1401:1401"
    depends_on:
      redis:
        condition: service_healthy
      rabbit-mq:
        condition: service_healthy
    environment:
      REDIS_CLIENT_HOST: redis
      AMQP_BROKER_HOST: rabbit-mq
    # jCli `persist` writes its profile here. The image only declares an anonymous volume for
    # this path, so after `docker compose down` + `up` Jasmin would start with a new empty one.
    volumes:
      - jasmin-store:/etc/jasmin/store
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
    security_opt:
      - no-new-privileges:true

  smppsim:
    image: jookies/smppsim:latest
    platform: linux/amd64
    restart: unless-stopped
    # SMPP (2775) is NOT published: only jasmin (same compose network) reaches it as "smppsim:2775".
    # Only its web page is published, on the Mac loopback only: http://127.0.0.1:8089
    # (SMPPSim listens on 89 inside the container, per its startup log).
    ports:
      - "127.0.0.1:8089:89"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    security_opt:
      - no-new-privileges:true

volumes:
  jasmin-store:
